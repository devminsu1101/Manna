<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>만나 · 이어지는 기도</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#333;background:#ecebea;font-size:16px;--pink:#ff2d55;--soft:#ffeff2}*{box-sizing:border-box}body{margin:0 auto;max-width:430px;background:white;min-height:100dvh}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;background:#f5f5f5;padding:10px 14px;font-weight:650}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #00a4ac;outline-offset:3px}header{padding:18px 20px;background:var(--soft);display:flex;align-items:center;justify-content:space-between}header strong{font-size:22px;letter-spacing:-1px}header span{font-size:12px;color:#85565f}.demo{padding:12px 20px;border-bottom:1px solid #eee;font-size:13px;line-height:1.6;color:#666}.tabs{display:flex;padding:14px 20px 0;gap:6px}.tabs button{flex:1;background:white;border-bottom:3px solid transparent;border-radius:0;padding:12px 3px;font-size:14px}.tabs button[aria-pressed=true]{border-color:var(--pink);color:#bd2040}main{padding:24px 20px 110px}h1{font-size:25px;letter-spacing:-1px;line-height:1.45;margin:0 0 8px}h2{font-size:18px;margin:0}p{line-height:1.7}.muted{color:#707070;font-size:14px}.intro{margin:0 0 22px}.section{background:var(--soft);padding:16px;border-radius:16px;margin:18px 0}.section.warm{background:#fdfcf0}.heading{display:flex;align-items:center;gap:9px;margin-bottom:14px}.mascot{width:36px;height:36px;object-fit:contain}.heading h2{flex:1}.badge{font-size:12px;border-radius:20px;padding:5px 9px;background:#ffeff2;color:#af2440;display:inline-block}.badge.done{background:#eef6ee;color:#32623a}.card{background:white;border-radius:12px;padding:16px;margin-top:10px;overflow-wrap:anywhere}.card p{font-size:15px;white-space:pre-wrap;margin:12px 0}.card summary{font-weight:700;line-height:1.6;cursor:pointer;margin:10px 0;min-height:44px}.card summary::marker{color:#b57683}.meta{font-size:13px;color:#777}.row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.actions button{font-size:13px;padding:8px 10px}.primary{background:var(--pink);color:white}.wide{width:100%}.outline{border:1px solid #e1b6bf;background:white;color:#b82442}.count{color:#b82442;font-weight:650;font-size:14px}.stats{display:flex;justify-content:space-around;text-align:center;padding:20px 0;background:#fdfcf0;border-radius:16px;margin:20px 0}.stats b{display:block;font-size:26px;margin-bottom:5px}.stats span{font-size:13px;color:#6b6453}.profile{display:flex;align-items:center;gap:14px;margin:20px 0}.avatar{width:64px;height:64px;background:var(--soft);border:2px solid var(--pink);border-radius:50%;padding:8px}.profile p{margin:4px 0;font-size:14px;color:#777}.notice{background:#f0fffe;padding:13px 16px;border-radius:12px;font-size:14px;line-height:1.7}.sticky{position:fixed;bottom:0;width:min(100%,430px);left:50%;transform:translateX(-50%);background:#fffef9;border-top:1px solid #eee;padding:12px 20px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;align-items:center}.sticky span{font-size:13px;color:#666}.sticky button{font-size:13px}dialog{border:0;border-radius:22px;padding:24px;width:min(400px,calc(100% - 24px));max-height:90dvh;overflow:auto}dialog::backdrop{background:#30202970}dialog h2{font-size:22px}label{display:block;margin:20px 0 8px;font-weight:650;font-size:15px}input,textarea{width:100%;border:1px solid #d6cdd0;border-radius:12px;padding:13px;background:white;font-size:16px}textarea{resize:vertical;min-height:160px;line-height:1.7}.counter{text-align:right;font-size:12px;color:#777;margin:7px 0 20px}.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;line-height:1.6}.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--pink)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:min(380px,90%);padding:14px 18px;background:#393235;color:white;border-radius:12px;font-size:14px;z-index:5;line-height:1.6}a{color:#a82540}[hidden]{display:none!important}
/* Native horizontal scrolling reveals actions without blocking vertical scrolling. */
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;margin-top:10px;background:#fff;overscroll-behavior-x:contain}.swipe::-webkit-scrollbar{display:none}.topic{flex:0 0 100%;min-width:0;scroll-snap-align:center;background:white;padding:14px 12px;margin:0}.swipe-action{flex:0 0 82px;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#ffe0e7}.swipe-action:last-child{scroll-snap-align:end;background:#fff3b5}.swipe-action button{background:transparent;display:grid;justify-items:center;gap:6px;font-size:12px;padding:12px 5px;width:100%;height:100%;color:#a12540}.swipe-action:last-child button{color:#6b5b18}.swipe-action svg,.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.topic-top{display:flex;align-items:flex-start;gap:7px}.activation{margin:0;display:flex;align-items:center;justify-content:center;flex:0 0 38px;min-height:44px;cursor:pointer}.activation input{appearance:none;width:23px;height:23px;border:1.5px solid #c7bdc0;border-radius:50%;padding:0;margin:0;display:grid;place-content:center}.activation input:checked{background:var(--pink);border-color:var(--pink)}.activation input:checked:after{content:'✓';color:white;font-size:16px;font-weight:700}.topic details{flex:1;min-width:0}.topic summary{margin:0;min-height:44px;display:flex;align-items:center;font-weight:650;font-size:15px;line-height:1.6;list-style:none;cursor:pointer}.topic summary::-webkit-details-marker{display:none}.topic p{margin:8px 0 12px;color:#666;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.topic summary{overflow-wrap:anywhere}.topic-foot{display:flex;align-items:center;gap:10px;margin-left:45px;margin-top:2px;color:#85777b;font-size:13px}.topic-foot .count{font-size:13px;font-weight:500;color:#85777b}.icon-button{background:transparent;display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:8px;flex-shrink:0;color:#8b8083}.topic.inactive summary{color:#8a8486}.topic-foot button{background:none;min-height:30px;font-size:12px;color:#8b6971;padding:0}.swipe-hint{text-align:center;font-size:12px;color:#8b8083;margin:15px 0 0}.topic.readonly{border-radius:12px;margin-top:10px}.readonly .topic-foot{margin-left:0}
.swipe{display:block;position:relative;overflow:hidden;touch-action:pan-y;scroll-snap-type:none}.swipe>.topic{position:relative;z-index:1;transform:translateX(var(--offset,0px));transition:transform .2s ease;user-select:none}.swipe.dragging>.topic{transition:none}.swipe-action{position:absolute;inset:0 auto 0 0;width:max(82px,var(--offset,0px))}.swipe-action:last-child{inset:0 0 0 auto;width:max(82px,calc(-1 * var(--offset,0px)))}.swipe.ready .swipe-action:first-child{background:#ff2d55}.swipe.ready .swipe-action:first-child button{color:white}.swipe-action button{align-content:center}.toast button{margin-left:12px;background:transparent;color:#fff;text-decoration:underline}.swipe>.topic{border-radius:12px}@media(prefers-reduced-motion:reduce){.swipe>.topic{transition:none}}
</style></head>
<body>
<header><strong>만나 <span>함께 쌓이는 기도</span></strong><img class="mascot" src="../../apps/frontend/public/mascot/hi.png" alt=""></header>
<div class="demo">모바일 프로토타입 · 예시 인물 ‘하은’의 기록입니다.<br>내 화면과 친구가 보는 화면을 바꿔 체험해 보세요.</div>
<nav class="tabs" aria-label="예시 화면"><button data-view="mine" aria-pressed="true">내 기도제목</button><button data-view="pray" aria-pressed="false">중보기도</button><button data-view="stories" aria-pressed="false">이어진 나눔</button></nav>
<main id="main"></main>
<footer class="sticky"><span>예시 데이터로 자유롭게 눌러보세요</span><button id="reset">처음으로</button></footer>
<dialog id="editor" aria-labelledby="editorTitle"><form id="editForm"><div class="row"><h2 id="editorTitle">기도제목 올리기</h2><button type="button" data-close="editor" aria-label="닫기">닫기</button></div><p class="muted">마음에 있는 기도를 하나씩 남겨 주세요.</p><label for="title">제목 <span class="muted">필수</span></label><input id="title" maxlength="50" required placeholder="어떤 기도를 함께 나눌까요?"><div id="titleCount" class="counter">0 / 50</div><label for="body">내용 <span class="muted">선택</span></label><textarea id="body" maxlength="1000" placeholder="상황과 기도할 내용을 조금 더 알려 주세요."></textarea><div id="bodyCount" class="counter">0 / 1,000</div><p class="notice" id="editNote">올린 기도제목은 바로 ‘기도 중’이 되어 함께 기도받아요.</p><button id="save" class="primary wide">기도제목 올리기</button></form></dialog>
<dialog id="storyEditor" aria-labelledby="storyTitle"><form id="storyForm"><div class="row"><h2 id="storyTitle">나눔으로 이어가기</h2><button type="button" data-close="storyEditor">닫기</button></div><p id="linkedTitle" class="notice"></p><label for="storyBody">어떤 소식이 있나요?</label><textarea id="storyBody" required maxlength="2000" placeholder="기도 이후의 소식이나 감사한 마음을 나눠 주세요."></textarea><label class="check"><input type="checkbox" id="answered">이 기도에 응답받았어요. 응답을 표시하고 기도를 마무리할게요.</label><p class="muted">중간 소식만 나눌 수도 있어요. 나눔을 올려도 자동으로 마무리되지는 않아요.</p><button class="primary wide">나눔 올리기</button></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const seed=[{id:1,title:'어머니의 수술과 회복을 위해',body:'다음 주 수요일에 어머니 수술이 예정되어 있어요. 수술이 잘 진행되고, 기다리는 가족들도 평안할 수 있도록 함께 기도해 주세요.',active:true,answered:false,count:24},{id:2,title:'새로운 직장에서 지혜롭게 적응하도록',body:'이번 달부터 새로운 팀에서 일하게 됐어요. 조급해하지 않고 동료들의 이야기를 잘 들으며 제 역할을 찾아가고 싶어요.',active:true,answered:false,count:12},{id:3,title:'오랜 친구와의 관계 회복',body:'서로의 마음을 차분히 이야기할 수 있는 시간을 위해 기도했어요.',active:false,answered:true,count:31}];
let topics=structuredClone(seed),stories=[{topicId:3,body:'먼저 연락할 용기를 주셨어요. 오랜만에 만나 서로의 이야기를 듣고 오해를 풀었습니다. 함께 기도해 주셔서 감사해요.',answered:true}],events=[],view='mine',editing=null,linking=null,timer;
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function recordPrayer(items,logs){const ids=items.filter(t=>t.active).map(t=>t.id);if(!ids.length)return 0;items.forEach(t=>{if(ids.includes(t.id))t.count++});logs.push({topicIds:ids});return ids.length}
function validTopic(title,body){return title.trim().length>0&&title.length<=50&&body.length<=1000}
function announce(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4000)}
function icon(name){const paths={edit:'<path d="m15 4 5 5M4 20l4-1L20 7a2 2 0 0 0-4-4L4 15z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',story:'<path d="M5 4h14v13H9l-4 4zM9 8h6M9 12h4"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`}
function card(t,owner){const content=`<article class="topic ${t.active?'':'inactive'} ${owner?'':'readonly'}"><div class="topic-top">${owner?`<label class="activation"><input type="checkbox" data-action="toggle" data-id="${t.id}" ${t.active?'checked':''} aria-label="${escapeHtml(t.title)} 기도 활성화"></label>`:''}<details><summary>${escapeHtml(t.title)}</summary><p>${escapeHtml(t.body||'제목에 마음을 담아 함께 기도해 주세요.')}</p></details>${owner?`<button class="icon-button" data-action="edit" data-id="${t.id}" aria-label="${escapeHtml(t.title)} 수정">${icon('edit')}</button>`:''}</div><div class="topic-foot"><span class="count" aria-label="받은 기도 ${t.count}회"><span aria-hidden="true">🙏 ${t.count}</span></span>${t.answered?'<span>응답 ✓</span>':''}${stories.some(s=>s.topicId===t.id)?'<button data-action="stories">나눔 ↗</button>':''}</div></article>`;return owner?`<div class="swipe" role="group" aria-label="${escapeHtml(t.title)}. 오른쪽으로 밀면 삭제, 왼쪽으로 밀면 나눔"><div class="swipe-action"><button data-action="delete" data-id="${t.id}" aria-label="${escapeHtml(t.title)} 삭제">${icon('trash')}<span>삭제</span></button></div>${content}<div class="swipe-action"><button data-action="story" data-id="${t.id}" aria-label="${escapeHtml(t.title)} 나눔으로 이어가기">${icon('story')}<span>나눔으로<br>이어가기</span></button></div></div>`:content}
function render(){renderContent();document.querySelectorAll('.swipe').forEach(setupSwipe)}
function swipeResult(offset,width){return offset>=width*.6?'delete':offset<=-width*.6?'story':null}
function confirmDelete(id){if(confirm('삭제하시겠습니까?'))removeWithUndo(id)}
function removeWithUndo(id){const index=topics.findIndex(t=>t.id===id);if(index<0)return;const topic=topics[index];deleteTopic(id);render();announce('기도제목을 삭제했어요.');clearTimeout(timer);const undo=document.createElement('button');undo.textContent='되돌리기';undo.onclick=()=>{topics.splice(Math.min(index,topics.length),0,topic);render();announce('기도제목을 되돌렸어요.')};$('toast').append(undo);timer=setTimeout(()=>$('toast').hidden=true,8000)}
function setupSwipe(row){let start=null,offset=0,suppressClick=false;const surface=row.querySelector('.topic');function paint(value){offset=value;row.style.setProperty('--offset',`${value}px`)}
function act(action){paint(0);if(action==='delete')confirmDelete(Number(row.querySelector('[data-action="delete"]').dataset.id));else if(action==='story')row.querySelector('[data-action="story"]').click()}
row.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||!surface.contains(e.target))return;start={id:e.pointerId,x:e.clientX,y:e.clientY,offset,dragging:false};suppressClick=false});
row.addEventListener('pointermove',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!start.dragging){if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){start=null;return}if(Math.abs(dx)<10)return;start.dragging=true;row.setPointerCapture(e.pointerId);row.classList.add('dragging')}paint(Math.max(-row.clientWidth,Math.min(row.clientWidth,start.offset+dx)))});
function finish(e,cancelled){if(!start||start.id!==e.pointerId)return;const drag=start;start=null;row.classList.remove('dragging');if(!drag.dragging)return;const result=cancelled?null:swipeResult(offset,row.clientWidth);act(result);suppressClick=true;setTimeout(()=>{suppressClick=false},0)}
row.addEventListener('pointerup',e=>finish(e,false));row.addEventListener('pointercancel',e=>finish(e,true));row.addEventListener('lostpointercapture',e=>finish(e,true));row.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true);
row.addEventListener('focusin',e=>{const action=e.target.closest('.swipe-action');paint(action?(action===row.firstElementChild?82:-82):0)});
let wheelTimer,wheelOffset=null;
row.addEventListener('wheel',e=>{if(e.ctrlKey||Math.abs(e.deltaX)<=Math.abs(e.deltaY)||!e.deltaX)return;e.preventDefault();if(wheelOffset===null){wheelOffset=offset;row.classList.add('dragging')}const unit=e.deltaMode===1?16:e.deltaMode===2?row.clientWidth:1;wheelOffset=Math.max(-row.clientWidth,Math.min(row.clientWidth,wheelOffset-e.deltaX*unit));paint(wheelOffset);clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelOffset=null;row.classList.remove('dragging');if(row.isConnected)act(swipeResult(offset,row.clientWidth))},220)}, {passive:false});
}
function renderContent(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));const active=topics.filter(t=>t.active);if(view==='mine')$('main').innerHTML=`<h1>내 기도제목</h1><p class="muted intro">지금 함께 기도받을 제목에 체크해 주세요.</p><section class="section"><div class="heading"><img class="mascot" src="../../apps/frontend/public/mascot/tears.png" alt=""><h2>나의 기도</h2><span class="meta">${active.length}개 활성</span></div>${topics.map(t=>card(t,true)).join('')||'<p class="muted">첫 기도제목을 남겨 주세요.</p>'}<p class="swipe-hint">오른쪽으로 밀어 삭제 · 왼쪽으로 밀어 나눔</p></section><button class="primary wide" data-action="new">＋ 기도제목 올리기</button>`;
else if(view==='pray')$('main').innerHTML=`<h1>하은님을 위해 기도해요</h1><p class="muted intro">친구에게 보이는 중보기도 화면이에요.</p><div class="profile"><img class="avatar" src="../../apps/frontend/public/mascot/hi.png" alt=""><div><h2>김하은</h2><p>은혜 공동체 · 함께 기도 중</p></div></div><section class="section"><div class="heading"><h2>함께 기도할 제목</h2><span class="badge">${active.length}개</span></div>${active.map(t=>card(t,false)).join('')||'<p>현재 활성화된 기도제목이 없어요.</p>'}</section><button class="primary wide" data-action="pray" ${!active.length||events.length?'disabled':''}>${events.length?'오늘 기도했어요 ✓':'하은님을 위해 기도했어요'}</button><p class="muted">한 번 누르면 지금 기도 중인 ${active.length}개 제목에 각각 1회가 기록돼요.</p><div class="stats"><div><b>${events.length}</b><span>이번 체험에서 한 기도</span></div><div><b>${events.reduce((n,e)=>n+e.topicIds.length,0)}</b><span>함께 기록된 제목</span></div></div>${events.length?'<p class="notice">기도 이후 제목을 추가하거나 쉬어도, 방금 남긴 기도 기록은 그대로예요.</p>':''}`;
else $('main').innerHTML=`<h1>기도가 이야기가 될 때</h1><p class="muted intro">기다리는 시간도, 응답의 기쁨도 함께 나눠요.</p><section class="section warm"><div class="heading"><img class="mascot" src="../../apps/frontend/public/mascot/together.png" alt=""><h2>기도에서 이어진 나눔</h2></div>${stories.map(s=>{const t=topics.find(t=>t.id===s.topicId)||s.topic;return `<article class="card"><div class="row"><strong>김하은</strong><span class="badge ${s.answered?'done':''}">${s.answered?'응답 나눔':'기도의 중간 소식'}</span></div><p>${escapeHtml(s.body)}</p><div class="notice"><span class="meta">이 기도에서 이어졌어요</span><br><strong>${escapeHtml(t.title)}</strong><br><span class="count">함께 받은 기도 ${t.count}회</span></div></article>`}).join('')}</section>`}
function deleteTopic(id){const topic=topics.find(t=>t.id===id);stories.filter(s=>s.topicId===id).forEach(s=>s.topic={...topic});topics=topics.filter(t=>t.id!==id)}
function updateCounts(){const title=$('title').value,body=$('body').value;$('titleCount').textContent=`${title.length} / 50`;$('bodyCount').textContent=`${body.length} / 1,000`;const old=topics.find(t=>t.id===editing);$('save').disabled=!validTopic(title,body)||!!old&&old.title===title.trim()&&old.body===body.trim()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('main').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const t=topics.find(t=>t.id===Number(b.dataset.id));switch(b.dataset.action){case'new':case'edit':editing=t?.id??null;$('title').value=t?.title??'';$('body').value=t?.body??'';$('editorTitle').textContent=t?'기도제목 수정':'기도제목 올리기';$('save').textContent=t?'변경 내용 저장':'기도제목 올리기';$('editNote').textContent=t?'같은 기도제목의 내용을 수정해요. 받은 기도 횟수는 유지돼요.':'올린 기도제목은 바로 ‘기도 중’이 되어 함께 기도받아요.';updateCounts();$('editor').showModal();break;case'toggle':t.active=!t.active;render();announce(t.active?'다시 함께 기도받아요.':'기도를 쉬어가요. 지금까지 받은 기도는 남아 있어요.');break;case'delete':confirmDelete(t.id);break;case'story':linking=t.id;$('linkedTitle').textContent=t.title;$('storyBody').value='';$('answered').checked=false;$('storyEditor').showModal();break;case'stories':view='stories';render();break;case'pray':if(events.length)return;const n=recordPrayer(topics,events);render();announce(`하은님께 기도를 전했어요. ${n}개 제목에 각각 1회가 쌓였어요.`)}};
['title','body'].forEach(id=>$(id).addEventListener('input',updateCounts));
$('editForm').onsubmit=e=>{e.preventDefault();if($('save').disabled||!validTopic($('title').value,$('body').value))return;const data={title:$('title').value.trim(),body:$('body').value.trim()};if(editing)Object.assign(topics.find(t=>t.id===editing),data);else topics.unshift({id:Math.max(0,...topics.map(t=>t.id),...stories.map(s=>s.topicId))+1,...data,active:true,answered:false,count:0});$('editor').close();render();announce(editing?'기도제목을 수정했어요.':'새 기도제목을 올렸어요.')};
$('storyForm').onsubmit=e=>{e.preventDefault();const body=$('storyBody').value.trim();if(!body)return;const answered=$('answered').checked;stories.unshift({topicId:linking,body,answered});if(answered)Object.assign(topics.find(t=>t.id===linking),{answered:true,active:false});$('storyEditor').close();view='stories';render();announce(answered?'응답 나눔을 남기고 기도를 마무리했어요.':'기도의 소식을 나눴어요.')};
$('reset').onclick=()=>{topics=structuredClone(seed);stories=[{topicId:3,body:'먼저 연락할 용기를 주셨어요. 오랜만에 만나 서로의 이야기를 듣고 오해를 풀었습니다. 함께 기도해 주셔서 감사해요.',answered:true}];events=[];view='mine';render();announce('예시를 처음 상태로 되돌렸어요.')};
render();
</script></body></html>
