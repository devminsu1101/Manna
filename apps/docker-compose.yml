version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: manna_postgres
    environment:
      POSTGRES_DB: manna_db
      POSTGRES_USER: manna_user
      POSTGRES_PASSWORD: manna_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - manna_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manna_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (DB 관리 UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: manna_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - manna_network

volumes:
  postgres_data:

networks:
  manna_network:
    driver: bridge
