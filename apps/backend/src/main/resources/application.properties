spring.application.name=manna-backend

# ── 로컬 시크릿 ───────────────────────────────────────────────────────
# apps/backend/.env(KEY=VALUE)를 설정 파일로 읽는다 — run-local.sh 없이 IntelliJ에서 띄워도 GOOGLE_* 가 잡힌다.
# 파일이 없으면 건너뛴다(optional). 배포 이미지엔 .dockerignore로 .env가 빠지고, OS 환경변수가 이 값보다 우선한다.
spring.config.import=optional:file:.env[.properties]

# ── Database ──────────────────────────────────────────────────────────
# apps/docker-compose.yml의 Postgres 크레덴셜과 일치. Docker를 띄우면 init-db.sql이
# 자동 실행돼 스키마가 선다. 다른 호스트/포트면 SPRING_DATASOURCE_URL 환경변수로 덮는다.
spring.datasource.url=jdbc:postgresql://localhost:5432/manna_db
spring.datasource.username=manna_user
spring.datasource.password=manna_password

# 스키마는 init-db.sql이 소유한다. Hibernate는 만들지 말고 엔티티와 일치하는지만 검증.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── OAuth2 (Google) ───────────────────────────────────────────────────
# 시크릿은 코드/저장소에 두지 않는다 — 환경변수로 주입한다(GOOGLE_CLIENT_ID/SECRET).
# Google은 CommonOAuth2Provider라 endpoint는 자동, id+secret+scope만 준다.
# 기본 콜백은 {baseUrl}/login/oauth2/code/google. 프록시 뒤라 baseUrl은 :3000이 된다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# redirect_uri를 프론트 오리진으로 못박는다. 요청 헤더에서 추측하면 Vercel → Railway 경로에서
# X-Forwarded-Host가 Vercel 주소로 오지 않아 Railway 주소가 나온다 — 그러면 Google이 거부하고,
# 통과시켜도 세션 쿠키가 Railway 도메인에 붙어 프론트에선 로그인이 안 된 것으로 보인다.
spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend-origin}/login/oauth2/code/{registrationId}

# ── 로그인 유지 (D-3620) ──────────────────────────────────────────────
# 세션은 Postgres(spring_session, init-db.sql)에 둔다 — 재배포 · 재시작에도 로그인이 남는다.
# 서버 쪽 만료는 마지막 접속부터 1년(접속마다 연장). 쿠키 Max-Age는 로그인할 때만 써지므로
# 실제로는 로그인한 날부터 최대 1년이다. ponytail: 접속마다 쿠키도 늘리려면 필터로 다시 써 준다.
# 기본값(30분 무활동 · 브라우저 닫으면 끝나는 세션 쿠키)이 "금방 풀리는" 원인이었다.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=365d
server.servlet.session.cookie.max-age=365d

# ── 프론트 오리진 ─────────────────────────────────────────────────────
# 브라우저가 보는 주소. OAuth redirect_uri와 로그인 후·로그아웃 후 이동(SecurityConfig)이 이 값을 쓴다.
# 로컬은 Next dev(:3000), 프로덕션은 FRONTEND_ORIGIN 환경변수(Vercel 주소, 끝에 / 없이)로 덮는다.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# ── 포트 ──────────────────────────────────────────────────────────────
# 배포 플랫폼(Railway 등)은 들을 포트를 PORT 환경변수로 준다. 안 읽으면 8080에 붙어
# 헬스체크가 실패하고 배포가 계속 죽는다. 로컬에는 PORT가 없으니 8080이 기본값.
server.port=${PORT:8080}

# ── Swagger ───────────────────────────────────────────────────────────
# http://localhost:8080/swagger-ui.html. "Try it out"의 쓰기 요청에 XSRF-TOKEN 쿠키 값을
# X-XSRF-TOKEN 헤더로 실어 준다 — 없으면 CSRF(D-3101)에 걸려 403이다.
springdoc.swagger-ui.csrf.enabled=true

# ── 프록시 뒤에서 실행─────────────────────────────────────────────────
# Next(:3000)나 Railway 엣지가 붙인 X-Forwarded-* 를 반영한다(https 판정 등).
# 브라우저가 볼 주소는 여기에 맡기지 않는다 — 프로덕션에선 Vercel 주소가 오지 않는다.
# 그건 위의 app.frontend-origin이 정한다.
server.forward-headers-strategy=framework
